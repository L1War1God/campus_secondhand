<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 校园二手交易平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    {% include 'header.html' %}

    <!-- 英雄区域 -->
    <div class="hero-section">
        <div class="container">
            <div class="hero-content">
                <h1>🏫 校园二手交易平台</h1>
                <p>让闲置物品焕发新生,让校园生活更加精彩</p>
                <div class="hero-buttons">
                    <a href="/page/publish" class="hero-btn">📦 发布商品</a>
                    <a href="/page/login" class="hero-btn hero-btn-outline">🔐 登录/注册</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <div class="container">
            <div class="search-wrapper">
                <div class="search-input-wrapper">
                    <input type="text" id="searchKeyword" class="search-input" placeholder="搜索商品..." autocomplete="off">
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>
                <select id="searchSort" class="search-select">
                    <option value="all">全部商品</option>
                    <option value="created_at">最新发布</option>
                    <option value="price_asc">价格从低到高</option>
                    <option value="price_desc">价格从高到低</option>
                    <option value="sales_desc">销量最高</option>
                    <option value="views_desc">人气最高</option>
                    <option value="rating_desc">评分最高</option>
                </select>
                <button type="button" class="search-btn" onclick="searchProducts(true)">🔍 搜索</button>
            </div>

            <!-- 搜索记录 -->
            <div class="search-history" id="searchHistory">
                <span class="history-label">📝 搜索记录：</span>
                <div class="history-tags" id="historyTags"></div>
                <button type="button" class="clear-history-btn" onclick="clearSearchHistory()" style="display: none;">清除记录</button>
            </div>

            <!-- 价格筛选 -->
            <div class="price-filter">
                <input type="number" id="minPrice" class="price-input" placeholder="最低价" min="0" step="1" oninput="validateMinPrice()">
                <span class="price-separator">-</span>
                <input type="number" id="maxPrice" class="price-input" placeholder="最高价" min="0" step="1" oninput="validateMaxPrice()">
                <button type="button" class="price-btn" onclick="searchProducts()">筛选</button>
            </div>

            <!-- 热门搜索 -->
            <div class="hot-searches" id="hotSearches">
                <span class="hot-label">🔥 热门搜索：</span>
            </div>
        </div>
    </div>

    <!-- 分类导航 -->
    <div class="category-nav">
        <div class="container">
            <div class="category-list" id="categoryList">
                <button class="category-item active" data-id="" onclick="filterByCategory('')">
                    <span class="category-icon">📦</span>
                    <span>全部</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 统计数据 -->
    <div class="container">
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value">5,000+</div>
                <div class="stat-label">注册用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value">10,000+</div>
                <div class="stat-label">商品数量</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💳</div>
                <div class="stat-value">8,000+</div>
                <div class="stat-label">成交订单</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value">98%</div>
                <div class="stat-label">好评率</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="results-header">
            <h2 class="section-title">🔥 最新商品</h2>
            <span class="results-count" id="resultsCount">共 0 件商品</span>
        </div>
        <div id="productList" class="product-grid">
            <div class="loading">加载中...</div>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination">
        </div>
    </div>

    {% include 'footer.html' %}

    <script src="/static/js/main.js"></script>
    <script>
        let currentPage = 1;
        let currentCategory = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', function () {
            loadCategories();
            loadProducts();
            loadHotSearches();
            initSearchSuggestions();
            renderSearchHistory();
        });

        // 加载分类
        async function loadCategories() {
            const result = await apiGet('/categories');
            if (result.code === 200) {
                renderCategories(result.data);
            }
        }

        // 当前展开的大分类ID
        let expandedCategory = null;

        // 渲染分类导航
        function renderCategories(categories) {
            const container = document.getElementById('categoryList');
            let html = '';

            categories.forEach(cat => {
                const hasChildren = cat.children && cat.children.length > 0;
                const isExpanded = expandedCategory === cat.id;

                html += `
                    <button class="category-item ${hasChildren ? 'has-children' : ''}" 
                            data-id="${cat.id}" 
                            onclick="toggleCategory(${cat.id})">
                        <span class="category-icon">${getCategoryIcon(cat.name)}</span>
                        <span>${cat.name}</span>
                        ${hasChildren ? '<span class="expand-icon">' + (isExpanded ? '▼' : '▶') + '</span>' : ''}
                    </button>
                `;

                // 添加子分类容器
                if (hasChildren) {
                    html += `<div class="sub-category-container ${isExpanded ? 'expanded' : ''}" id="sub-${cat.id}">`;
                    cat.children.forEach(sub => {
                        html += `
                            <button class="category-item sub-category" data-id="${sub.id}" onclick="filterByCategory(${sub.id}); event.stopPropagation();">
                                <span>${sub.name}</span>
                            </button>
                        `;
                    });
                    html += '</div>';
                }
            });

            container.innerHTML += html;
        }

        // 切换分类展开/收起并筛选商品
        function toggleCategory(categoryId) {
            if (expandedCategory === categoryId) {
                // 收起
                expandedCategory = null;
                document.getElementById(`sub-${categoryId}`)?.classList.remove('expanded');
            } else {
                // 先收起其他展开的分类
                if (expandedCategory !== null) {
                    document.getElementById(`sub-${expandedCategory}`)?.classList.remove('expanded');
                }
                // 展开当前分类
                expandedCategory = categoryId;
                document.getElementById(`sub-${categoryId}`)?.classList.add('expanded');
            }

            // 更新展开图标
            updateExpandIcons();

            // 筛选该大分类下的所有商品
            filterByCategory(categoryId);
        }

        // 更新展开图标
        function updateExpandIcons() {
            document.querySelectorAll('.category-item.has-children').forEach(btn => {
                const icon = btn.querySelector('.expand-icon');
                const catId = parseInt(btn.dataset.id);
                icon.textContent = expandedCategory === catId ? '▼' : '▶';
            });
        }

        // 获取分类图标
        function getCategoryIcon(name) {
            const icons = {
                '数码产品': '📱',
                '学习资料': '📚',
                '生活用品': '🏠',
                '体育用品': '⚽',
                '服装服饰': '👕',
                '美妆护肤': '💄',
                '其他': '📦'
            };
            return icons[name] || '📦';
        }

        // 加载商品列表
        async function loadProducts(page = 1) {
            currentPage = page;

            let url = `/products/search?page=${page}`;

            // 添加分类筛选
            if (currentCategory) {
                url += `&category_id=${currentCategory}`;
            }

            // 添加关键词搜索
            const keyword = document.getElementById('searchKeyword').value;
            if (keyword) {
                url += `&keyword=${encodeURIComponent(keyword)}`;
            }

            // 添加价格筛选
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            if (minPrice) url += `&min_price=${minPrice}`;
            if (maxPrice) url += `&max_price=${maxPrice}`;

            // 添加排序
            const sortBy = document.getElementById('searchSort').value;
            url += `&sort_by=${sortBy}`;

            const result = await apiGet(url);
            if (result.code === 200) {
                renderProducts(result.data);
                renderPagination(result);
                document.getElementById('resultsCount').textContent = `共 ${result.total} 件商品`;
            }
        }

        // 获取商品主图
        function getProductImage(product) {
            if (product.images && product.images.length > 0) {
                // 对中文文件名进行URL编码
                return encodeURI(product.images[0]);
            }
            return null;
        }

        // 渲染星星评分
        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let starsHtml = '';
            
            for (let i = 0; i < 5; i++) {
                if (i < fullStars) {
                    starsHtml += '<span class="star star-full">★</span>';
                } else if (i === fullStars && hasHalfStar) {
                    starsHtml += '<span class="star star-half">★</span>';
                } else {
                    starsHtml += '<span class="star star-empty">★</span>';
                }
            }
            
            return starsHtml;
        }

        // 渲染商品
        function renderProducts(products) {
            const container = document.getElementById('productList');
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>暂无商品</h3><p>快来发布第一件商品吧!</p></div>';
                return;
            }

            container.innerHTML = products.map(product => {
                const image = getProductImage(product);
                const imageHtml = image
                    ? `<img src="${image}" alt="${escapeHtml(product.title)}" class="product-img">`
                    : `<div class="product-no-image">📷</div>`;

                const originalPrice = product.original_price
                    ? `<span class="product-original-price">¥${product.original_price}</span>`
                    : '';

                return `
                <div class="product-card">
                    <button class="product-favorite-btn" data-product-id="${product.id}" onclick="toggleFavorite(${product.id}, this)" title="收藏">
                        <span>❤️</span>
                    </button>
                    <a href="/page/product/${product.id}" class="product-image-link">
                        <div class="product-image">${imageHtml}</div>
                    </a>
                    <div class="product-info">
                        <h3 class="product-title"><a href="/page/product/${product.id}">${escapeHtml(product.title)}</a></h3>
                        <div class="product-price">
                            <span class="current-price">¥${product.price}</span>
                            ${originalPrice}
                        </div>
                        <p class="product-desc">${escapeHtml(product.description)}</p>
                        <div class="product-meta">
                            <span>👁️ ${product.views || 0}</span>
                            <span>📅 ${getConditionText(product.condition)}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            syncFavoriteButtons(container);
        }

        // 渲染分页
        function renderPagination(data) {
            const container = document.getElementById('pagination');
            const { total, page, per_page, total_pages } = data;

            if (total_pages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '<div class="pagination-container">';

            // 上一页
            if (page > 1) {
                html += `<button class="pagination-btn" onclick="loadProducts(${page - 1})">上一页</button>`;
            }

            // 页码
            for (let i = 1; i <= total_pages; i++) {
                if (i === page) {
                    html += `<button class="pagination-btn active">${i}</button>`;
                } else {
                    // 只显示当前页附近的页码
                    if (i <= 3 || i >= total_pages - 2 || (i >= page - 2 && i <= page + 2)) {
                        html += `<button class="pagination-btn" onclick="loadProducts(${i})">${i}</button>`;
                    } else if (i === 4 || i === total_pages - 3) {
                        html += '<span class="pagination-dots">...</span>';
                    }
                }
            }

            // 下一页
            if (page < total_pages) {
                html += `<button class="pagination-btn" onclick="loadProducts(${page + 1})">下一页</button>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // 搜索商品
        // isActiveSearch: true表示用户主动搜索（点击搜索按钮/按回车），false表示筛选或跳转
        function searchProducts(isActiveSearch = false) {
            const keyword = document.getElementById('searchKeyword').value.trim();
            // 只有用户主动搜索时才添加搜索记录
            if (isActiveSearch && keyword) {
                addSearchHistory(keyword);
            }
            loadProducts(1);
        }

        // 添加搜索记录
        function addSearchHistory(keyword) {
            let history = getSearchHistory();
            
            // 移除重复项
            history = history.filter(item => item !== keyword);
            
            // 添加到开头
            history.unshift(keyword);
            
            // 只保留最近10条记录
            if (history.length > 10) {
                history = history.slice(0, 10);
            }
            
            // 保存到本地存储
            localStorage.setItem('searchHistory', JSON.stringify(history));
            
            // 更新显示
            renderSearchHistory();
        }

        // 获取搜索记录
        function getSearchHistory() {
            const stored = localStorage.getItem('searchHistory');
            return stored ? JSON.parse(stored) : [];
        }

        // 渲染搜索记录
        function renderSearchHistory() {
            const history = getSearchHistory();
            const container = document.getElementById('historyTags');
            const clearBtn = document.querySelector('.clear-history-btn');
            
            if (history.length === 0) {
                container.innerHTML = '<span class="no-history">暂无搜索记录</span>';
                clearBtn.style.display = 'none';
            } else {
                container.innerHTML = history.map(keyword => 
                    `<span class="history-tag" onclick="searchByHistory('${keyword}')">${keyword}</span>`
                ).join('');
                clearBtn.style.display = 'inline-block';
            }
        }

        // 通过历史记录搜索
        function searchByHistory(keyword) {
            document.getElementById('searchKeyword').value = keyword;
            searchProducts();
        }

        // 清除搜索记录
        function clearSearchHistory() {
            localStorage.removeItem('searchHistory');
            renderSearchHistory();
        }

        // 按分类筛选
        function filterByCategory(categoryId) {
            currentCategory = categoryId;

            // 更新分类按钮状态
            document.querySelectorAll('.category-item').forEach(btn => {
                btn.classList.remove('active');
            });

            // 找到对应按钮并激活
            if (categoryId === '') {
                document.querySelector('.category-item[data-id=""]').classList.add('active');
            } else {
                document.querySelector(`.category-item[data-id="${categoryId}"]`).classList.add('active');
            }

            loadProducts(1);
        }

        // 获取商品成色文本
        function getConditionText(condition) {
            const map = { 'new': '全新', 'like_new': '99新', 'good': '良好', 'fair': '一般' };
            return map[condition] || condition;
        }

        // HTML转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 收藏/取消收藏
        async function toggleFavorite(productId, button) {
            const user = getCurrentUser();
            if (!user) {
                if (confirm('请先登录,是否前往登录页?')) {
                    window.location.href = '/page/login';
                }
                return;
            }

            const result = await apiPost('/favorite', {
                user_id: user.id,
                product_id: productId
            });

            if (result.code === 200) {
                showMessage('已收藏');
                updateFavoriteCache(user.id, productId, true);
                setFavoriteButtonState(button, true);
            } else if (result.code === 400 && result.message === '已收藏') {
                // 已收藏则取消收藏
                const unfavResult = await apiDelete(`/favorite/${productId}?user_id=${user.id}`);
                if (unfavResult.code === 200) {
                    showMessage('已取消收藏');
                    updateFavoriteCache(user.id, productId, false);
                    setFavoriteButtonState(button, false);
                } else {
                    showMessage(unfavResult.message || '操作失败', 'error');
                }
            } else {
                showMessage(result.message || '操作失败', 'error');
            }
        }

        // 加载热门搜索
        async function loadHotSearches() {
            const result = await apiGet('/products/hot-searches');
            if (result.code === 200 && result.data.length > 0) {
                const container = document.getElementById('hotSearches');
                result.data.forEach(keyword => {
                    const span = document.createElement('span');
                    span.className = 'hot-tag';
                    span.textContent = keyword;
                    span.onclick = () => {
                        document.getElementById('searchKeyword').value = keyword;
                        searchProducts();
                    };
                    container.appendChild(span);
                });
            }
        }

        // 初始化搜索建议
        function initSearchSuggestions() {
            const searchInput = document.getElementById('searchKeyword');
            const suggestionsContainer = document.getElementById('searchSuggestions');
            let debounceTimer;

            searchInput.addEventListener('input', function () {
                clearTimeout(debounceTimer);
                const keyword = this.value.trim();
                
                if (keyword.length < 2) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    const result = await apiGet(`/products/suggest?keyword=${encodeURIComponent(keyword)}`);
                    if (result.code === 200 && result.data.length > 0) {
                        renderSuggestions(result.data);
                    } else {
                        suggestionsContainer.style.display = 'none';
                    }
                }, 300);
            });

            searchInput.addEventListener('focus', function () {
                if (this.value.trim().length >= 2) {
                    suggestionsContainer.style.display = 'block';
                }
            });

            document.addEventListener('click', function (e) {
                if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
                    suggestionsContainer.style.display = 'none';
                }
            });
        }

        // 渲染搜索建议
        function renderSuggestions(suggestions) {
            const container = document.getElementById('searchSuggestions');
            container.innerHTML = suggestions.map(s => `
                <div class="suggestion-item" onclick="selectSuggestion('${escapeHtml(s)}')">${escapeHtml(s)}</div>
            `).join('');
            container.style.display = 'block';
        }

        // 选择搜索建议
        function selectSuggestion(keyword) {
            document.getElementById('searchKeyword').value = keyword;
            document.getElementById('searchSuggestions').style.display = 'none';
            searchProducts();
        }

        // 渲染商品（更新无结果提示）
        function renderProducts(products) {
            const container = document.getElementById('productList');
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>没有找到相关商品</h3>
                        <p>试试其他关键词或浏览全部分类</p>
                        <button class="btn" onclick="clearSearchAndReload()">浏览全部商品</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = products.map(product => {
                const image = getProductImage(product);
                const imageHtml = image
                    ? `<img src="${image}" alt="${escapeHtml(product.title)}" class="product-img">`
                    : `<div class="product-no-image">📷</div>`;

                const originalPrice = product.original_price
                    ? `<span class="product-original-price">¥${product.original_price}</span>`
                    : '';

                const stars = renderStars(product.rating || 5.0);

                return `
                <div class="product-card">
                    <button class="product-favorite-btn" data-product-id="${product.id}" onclick="toggleFavorite(${product.id}, this)" title="收藏">
                        <span>❤️</span>
                    </button>
                    <a href="/page/product/${product.id}" class="product-image-link">
                        <div class="product-image">${imageHtml}</div>
                    </a>
                    <div class="product-info">
                        <h3 class="product-title"><a href="/page/product/${product.id}">${escapeHtml(product.title)}</a></h3>
                        <div class="product-price">
                            <span class="current-price">¥${product.price}</span>
                            ${originalPrice}
                        </div>
                        <div class="product-rating">
                            ${stars}
                            <span class="rating-score">${(product.rating || 5.0).toFixed(1)}</span>
                            <span class="rating-count">(${product.rating_count || 0})</span>
                        </div>
                        <p class="product-desc">${escapeHtml(product.description)}</p>
                        <div class="product-meta">
                            <span>👁️ ${product.views || 0}</span>
                            <span>🔥 ${product.sales || 0}</span>
                            <span>📅 ${getConditionText(product.condition)}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            syncFavoriteButtons(container);
        }

        // 清除搜索并重新加载
        function clearSearchAndReload() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';

            document.getElementById('searchSort').value = 'created_at';
            currentCategory = '';
            loadProducts(1);
        }

        // 验证最低价输入
        function validateMinPrice() {
            const minInput = document.getElementById('minPrice');
            const maxInput = document.getElementById('maxPrice');
            let minValue = parseFloat(minInput.value);
            
            // 确保最小值不小于0
            if (isNaN(minValue) || minValue < 0) {
                minInput.value = '';
                return;
            }
            
            // 如果最大值存在且小于最小值，调整最大值
            const maxValue = parseFloat(maxInput.value);
            if (!isNaN(maxValue) && maxValue < minValue) {
                maxInput.value = minValue;
            }
        }

        // 验证最高价输入
        function validateMaxPrice() {
            const minInput = document.getElementById('minPrice');
            const maxInput = document.getElementById('maxPrice');
            let maxValue = parseFloat(maxInput.value);
            
            // 确保最大值不小于0
            if (isNaN(maxValue) || maxValue < 0) {
                maxInput.value = '';
                return;
            }
            
            // 如果最小值存在且大于最大值，调整最小值
            const minValue = parseFloat(minInput.value);
            if (!isNaN(minValue) && minValue > maxValue) {
                minInput.value = maxValue;
            }
        }

        // 回车键搜索
        document.getElementById('searchKeyword').addEventListener('keyup', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('searchSuggestions').style.display = 'none';
                searchProducts(true);
            }
        });
    </script>
</body>

</html>
