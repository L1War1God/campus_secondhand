<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园二手交易平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    {% include 'header.html' %}

    <div class="container">
        <div class="form-container">
            <h2 class="form-title">用户登录</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" class="form-control" required>
                    <span id="usernameHint" class="form-hint"></span>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" class="form-control" required>
                    <span id="passwordHint" class="form-hint"></span>
                </div>
                <div id="errorMsg" class="error-msg" style="display: none;"></div>
                <button type="submit" class="form-btn">登 录</button>
                <div class="form-footer">
                    还没有账号? <a href="/page/register">立即注册</a>
                </div>
            </form>
        </div>
    </div>

    {% include 'footer.html' %}

    <script src="/static/js/main.js"></script>
    <script>
        // 如果已登录,跳转首页
        if (getCurrentUser()) {
            window.location.href = '/page/index';
        }

        // 验证用户名
        function validateUsername(username) {
            const hint = document.getElementById('usernameHint');
            if (!username) {
                hint.textContent = '请输入用户名';
                hint.className = 'form-hint error';
                return false;
            }
            if (username.length < 3) {
                hint.textContent = '用户名至少需要3个字符';
                hint.className = 'form-hint error';
                return false;
            }
            if (username.length > 20) {
                hint.textContent = '用户名不能超过20个字符';
                hint.className = 'form-hint error';
                return false;
            }
            if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)) {
                hint.textContent = '用户名只能包含中文、字母、数字和下划线';
                hint.className = 'form-hint error';
                return false;
            }
            hint.textContent = '✓ 用户名格式正确';
            hint.className = 'form-hint success';
            return true;
        }

        // 验证密码
        function validatePassword(password) {
            const hint = document.getElementById('passwordHint');
            if (!password) {
                hint.textContent = '请输入密码';
                hint.className = 'form-hint error';
                return false;
            }
            if (password.length < 6) {
                hint.textContent = '密码至少需要6个字符';
                hint.className = 'form-hint error';
                return false;
            }
            if (password.length > 30) {
                hint.textContent = '密码不能超过30个字符';
                hint.className = 'form-hint error';
                return false;
            }
            // 检查密码强度
            let strength = 0;
            if (/[a-zA-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            if (strength === 1) {
                hint.textContent = '密码强度: 弱 - 建议使用字母+数字组合';
                hint.className = 'form-hint warning';
            } else if (strength === 2) {
                hint.textContent = '密码强度: 中';
                hint.className = 'form-hint success';
            } else {
                hint.textContent = '密码强度: 强';
                hint.className = 'form-hint success';
            }
            return true;
        }

        // 实时验证
        document.getElementById('username').addEventListener('blur', function() {
            validateUsername(this.value);
        });

        document.getElementById('password').addEventListener('blur', function() {
            validatePassword(this.value);
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            // 客户端验证
            if (!validateUsername(username)) {
                return;
            }
            if (!validatePassword(password)) {
                return;
            }

            const result = await apiPost('/login', { username, password });

            if (result.code === 200) {
                saveUser(result.data);
                showMessage('登录成功');
                setTimeout(() => {
                    window.location.href = '/page/index';
                }, 500);
            } else {
                errorMsg.textContent = result.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
