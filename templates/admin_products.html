<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 后台管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .admin-page {
            padding: 32px 0 60px;
        }

        .admin-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
        }

        .admin-card h2,
        .admin-card h3 {
            margin: 0 0 16px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .toolbar input,
        .toolbar select {
            min-width: 180px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-table th,
        .admin-table td {
            border-bottom: 1px solid #eee;
            padding: 12px 10px;
            text-align: left;
            vertical-align: top;
        }

        .admin-table th {
            background: #fafafa;
            font-weight: 600;
        }

        .mini-img {
            width: 54px;
            height: 54px;
            object-fit: cover;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #f3f4f6;
            font-size: 12px;
        }

        .status-on_sale { background: #e8f5e9; color: #2e7d32; }
        .status-off_sale { background: #ffebee; color: #c62828; }
        .status-sold_out { background: #fff8e1; color: #f57f17; }

        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .admin-form-grid .full {
            grid-column: 1 / -1;
        }

        .helper-text {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        @media (max-width: 960px) {
            .admin-form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    {% include 'header.html' %}

    <div class="container admin-page">
        <div class="admin-card">
            <h2>商品管理</h2>
            <p>在这里可以完成商品新增、修改、删除操作。</p>
        </div>

        <div class="admin-card">
            <h3 id="productFormTitle">新增商品</h3>
            <form id="productForm">
                <input type="hidden" id="editProductId">
                <div class="admin-form-grid">
                    <div class="form-group full">
                        <label>商品标题 *</label>
                        <input type="text" id="productTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>价格 *</label>
                        <input type="number" step="0.01" id="productPrice" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>原价</label>
                        <input type="number" step="0.01" id="productOriginalPrice" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>库存 *</label>
                        <input type="number" id="productStock" class="form-control" min="0" value="1" required>
                    </div>
                    <div class="form-group">
                        <label>状态</label>
                        <select id="productStatus" class="form-control">
                            <option value="on_sale">出售中</option>
                            <option value="off_sale">已下架</option>
                            <option value="sold_out">已售出</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>分类</label>
                        <select id="productCategoryId" class="form-control">
                            <option value="">请选择分类</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>商品成色</label>
                        <select id="productCondition" class="form-control">
                            <option value="new">全新</option>
                            <option value="like_new">99成新</option>
                            <option value="good">良好</option>
                            <option value="fair">一般</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>商品描述</label>
                        <textarea id="productDescription" rows="5" class="form-control" placeholder="描述商品情况..."></textarea>
                    </div>
                    <div class="form-group full">
                        <label>商品图片</label>
                        <textarea id="productImages" rows="3" class="form-control" placeholder="可填写 JSON 数组、逗号分隔或 ||| 分隔的图片地址/数据"></textarea>
                        <div class="helper-text">如果直接粘贴发布页上传后的数据，也可以正常保存。</div>
                    </div>
                </div>
                <div class="toolbar">
                    <button type="submit" class="form-btn">保存商品</button>
                    <button type="button" class="form-btn" onclick="resetProductForm()">重置</button>
                    <button type="button" class="form-btn" onclick="location.href='/page/admin'">返回管理首页</button>
                </div>
            </form>
        </div>

        <div class="admin-card">
            <h3>商品列表</h3>
            <div class="toolbar">
                <input type="text" id="productKeyword" class="form-control" placeholder="搜索商品标题">
                <select id="productStatusFilter" class="form-control">
                    <option value="">全部状态</option>
                    <option value="on_sale">出售中</option>
                    <option value="off_sale">已下架</option>
                    <option value="sold_out">已售出</option>
                </select>
                <button type="button" class="form-btn" onclick="loadProducts()">筛选</button>
            </div>
            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>图片</th>
                            <th>商品</th>
                            <th>分类</th>
                            <th>价格</th>
                            <th>库存</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr><td colspan="7">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}

    <script src="/static/js/main.js"></script>
    <script>
        const currentUser = getCurrentUser();
        if (!currentUser) {
            alert('请先登录');
            window.location.href = '/page/login';
        }
        
        // 确保只有管理员才能访问
        if (currentUser.role !== 'admin') {
            alert('您没有管理员权限');
            window.location.href = '/page/index';
        }

        let categoryCache = [];
        let productCache = [];

        document.addEventListener('DOMContentLoaded', async function () {
            await loadCategorySelects();
            await loadProducts();
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function normalizeImagesInput(value) {
            const raw = (value || '').trim();
            if (!raw) return [];
            if (raw.startsWith('[')) {
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return parsed.filter(Boolean);
                    }
                } catch (e) {
                    return [raw];
                }
            }
            if (raw.includes('|||')) {
                return raw.split('|||').map(item => item.trim()).filter(Boolean);
            }
            if (raw.includes(',')) {
                return raw.split(',').map(item => item.trim()).filter(Boolean);
            }
            return [raw];
        }

        function buildProductCategoryOptions(categories, depth = 0) {
            let html = '';
            categories.forEach(cat => {
                const prefix = depth > 0 ? '　'.repeat(depth) + '├ ' : '';
                html += `<option value="${cat.id}">${prefix}${escapeHtml(cat.name)}</option>`;
                if (cat.children && cat.children.length > 0) {
                    html += buildProductCategoryOptions(cat.children, depth + 1);
                }
            });
            return html;
        }

        async function loadCategorySelects() {
            const result = await apiGet('/categories');
            if (result.code === 200) {
                const productSelect = document.getElementById('productCategoryId');
                if (productSelect) {
                    productSelect.innerHTML = '<option value="">请选择分类</option>' + buildProductCategoryOptions(result.data || []);
                }
            }
        }

        async function loadProducts() {
            const keyword = document.getElementById('productKeyword').value.trim();
            const status = document.getElementById('productStatusFilter').value;
            const params = new URLSearchParams();
            params.set('page', '1');
            params.set('per_page', '100');
            if (keyword) params.set('keyword', keyword);
            if (status) params.set('status', status);

            const result = await apiGet(`/admin/products?${params.toString()}`);
            const body = document.getElementById('productTableBody');
            if (result.code !== 200) {
                body.innerHTML = '<tr><td colspan="7">商品加载失败</td></tr>';
                return;
            }

            const products = result.data || [];
            productCache = products;
            if (products.length === 0) {
                body.innerHTML = '<tr><td colspan="7">暂无商品</td></tr>';
                return;
            }

            body.innerHTML = products.map(product => {
                const image = product.images && product.images.length > 0 ? encodeURI(product.images[0]) : '';
                const imageHtml = image ? `<img src="${image}" class="mini-img" alt="${escapeHtml(product.title)}">` : '暂无';
                return `
                    <tr>
                        <td>${imageHtml}</td>
                        <td>
                            <div>${escapeHtml(product.title)}</div>
                            <div class="helper-text">ID: ${product.id} | 浏览 ${product.views || 0} | 销量 ${product.sales || 0}</div>
                        </td>
                        <td>${escapeHtml(product.category_name || '未分类')}</td>
                        <td>¥${product.price}</td>
                        <td>${product.stock ?? 0}</td>
                        <td><span class="status-tag status-${product.status}">${escapeHtml(product.status)}</span></td>
                        <td>
                            <div class="action-group">
                                <button type="button" class="pagination-btn" onclick="editProductById(${product.id})">编辑</button>
                                <button type="button" class="pagination-btn" onclick="deleteProduct(${product.id})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function resetProductForm() {
            document.getElementById('editProductId').value = '';
            document.getElementById('productFormTitle').textContent = '新增商品';
            document.getElementById('productForm').reset();
            document.getElementById('productStock').value = 1;
            document.getElementById('productStatus').value = 'on_sale';
        }

        function editProductById(id) {
            const product = productCache.find(item => item.id === id);
            if (!product) return;
            document.getElementById('editProductId').value = product.id;
            document.getElementById('productFormTitle').textContent = `编辑商品 #${product.id}`;
            document.getElementById('productTitle').value = product.title || '';
            document.getElementById('productPrice').value = product.price ?? '';
            document.getElementById('productOriginalPrice').value = product.original_price ?? '';
            document.getElementById('productStock').value = product.stock ?? 0;
            document.getElementById('productStatus').value = product.status || 'on_sale';
            document.getElementById('productCategoryId').value = product.category_id || '';
            document.getElementById('productCondition').value = product.condition || 'good';
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productImages').value = product.images && product.images.length ? product.images.join(',') : '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if (!confirm('确定要删除这个商品吗？')) return;
            const result = await apiDelete(`/product/${id}`);
            if (result.code === 200) {
                showMessage('商品已删除');
                loadProducts();
            } else {
                showMessage(result.message || '删除失败', 'error');
            }
        }

        document.getElementById('productForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const editId = document.getElementById('editProductId').value;
            const payload = {
                title: document.getElementById('productTitle').value.trim(),
                price: parseFloat(document.getElementById('productPrice').value),
                original_price: document.getElementById('productOriginalPrice').value ? parseFloat(document.getElementById('productOriginalPrice').value) : null,
                stock: parseInt(document.getElementById('productStock').value, 10),
                status: document.getElementById('productStatus').value,
                category_id: document.getElementById('productCategoryId').value ? parseInt(document.getElementById('productCategoryId').value, 10) : null,
                condition: document.getElementById('productCondition').value,
                description: document.getElementById('productDescription').value,
                images: normalizeImagesInput(document.getElementById('productImages').value)
            };

            if (!payload.title || Number.isNaN(payload.price) || payload.price <= 0) {
                showMessage('请填写正确的商品标题和价格', 'error');
                return;
            }
            if (Number.isNaN(payload.stock) || payload.stock < 0) {
                showMessage('请填写正确的库存数量', 'error');
                return;
            }

            const result = editId ? await apiPut(`/product/${editId}`, payload) : await apiPost('/product', {
                ...payload,
                user_id: currentUser.id
            });

            if (result.code === 200) {
                showMessage(editId ? '商品更新成功' : '商品创建成功');
                resetProductForm();
                await loadProducts();
                await loadCategorySelects();
            } else {
                showMessage(result.message || '保存失败', 'error');
            }
        });
    </script>
</body>

</html>
